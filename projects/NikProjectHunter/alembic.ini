# A generic, single database configuration.

[alembic]
# path to migration scripts
script_location = alembic/versions

# template used to generate migration file names; The default value is %%(rev)s_%%(slug)s
# Uncomment the line below for a more descriptive migration filename
# file_template = %%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present.
prepend_sys_path = .

# timezone to use when rendering the date within the migration file
# as well as the filename.
# string value is passed to dateutil.tz.gettz()
# leave blank for localtime
# timezone =

# max length of characters to apply to the "slug" field
# truncate_slug_length = 40

# set to 'true' to run the project during the 'revision' command
# revision_environment = false

# set to 'true' to allow .hierarchical traversal in migration scripts
# recursive_version_locations = false

# the output encoding used when revision files are written
# version_path_separator = os.pathsep  # Use os.pathsep. Default configuration used for new projects.

# the output encoding used when revision files are written
# output_encoding = utf-8

sqlalchemy.url = postgresql+asyncpg://nik:password@localhost:5432/nik_project_hunter


[post_write_hooks]
# post_write_hooks defines scripts or Python functions that are run
# on newly generated revision scripts. See the documentation for further
# detail and examples

# format using "black" - use the console_scripts runner,
# against the "black" entrypoint
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -l 79 REVISION_SCRIPT_FILENAME

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S