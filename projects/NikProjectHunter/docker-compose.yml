# =============================================================================
# Nik Project Hunter — Docker Compose 开发环境
# =============================================================================
# 技术栈：FastAPI + PostgreSQL (pgvector) + Redis + Playwright
# 版本：   MVP Phase 1 — 项目情报系统
# 目标：   一键启动完整开发环境
# =============================================================================

version: "3.9"

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL + pgvector
  # 用途：主数据库，存储项目、分析结果、未来 RAG 向量
  # 扩展：未来多租户只需增加 tenant_id 字段
  # ---------------------------------------------------------------------------
  postgres:
    image: pgvector/pgvector:pg17
    container_name: nph-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nik_project_hunter}
      POSTGRES_USER: ${POSTGRES_USER:-nik}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nik_secret_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nik} -d ${POSTGRES_DB:-nik_project_hunter}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ---------------------------------------------------------------------------
  # Redis
  # 用途：缓存、任务队列（Celery/APScheduler）、速率限制
  # 扩展：未来作为 Agent 消息总线、会话存储
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: nph-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # ---------------------------------------------------------------------------
  # pgAdmin（数据库管理界面）
  # 用途：开发调试用，非生产环境
  # ---------------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: nph-pgadmin
    restart: unless-stopped
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-nik@hoyin.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin_2026}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # FastAPI 应用服务
  # 用途：核心后端，包含 API、爬虫调度、AI 分析引擎
  # 扩展：未来可水平扩展为多个 worker 实例
  # ---------------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nph-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      # --- 数据库 ---
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-nik}:${POSTGRES_PASSWORD:-nik_secret_2026}@postgres:5432/${POSTGRES_DB:-nik_project_hunter}
      # --- Redis ---
      REDIS_URL: redis://redis:6379/0
      # --- LLM API（默认 DeepSeek，可替换为 OpenAI / Claude） ---
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_API_BASE: ${LLM_API_BASE:-https://api.deepseek.com}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
      # --- 通知（可选） ---
      WECHAT_WEBHOOK_URL: ${WECHAT_WEBHOOK_URL:-}
      # --- 爬虫配置 ---
      CRAWL_INTERVAL_MINUTES: ${CRAWL_INTERVAL_MINUTES:-60}
      # --- 应用日志级别 ---
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "pip install beautifulsoup4 && uvicorn app.main:app --host 0.0.0.0 --port 8000"

# =============================================================================
# 持久化卷
# =============================================================================
volumes:
  postgres_data:
    name: nph_postgres_data
  redis_data:
    name: nph_redis_data
  pgadmin_data:
    name: nph_pgadmin_data